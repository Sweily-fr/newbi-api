# Schema GraphQL pour les utilisateurs invités (visiteurs externes)

# Type principal pour un utilisateur invité
type UserInvited {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  name: String
  image: String
  requiresPassword: Boolean!
  linkedUserId: ID
  linkedUser: LinkedUserInfo
  boardsAccess: [BoardAccess!]!
  stats: UserInvitedStats!
  createdAt: DateTime!
  updatedAt: DateTime!
  lastLoginAt: DateTime
}

# Informations du compte Newbi lié (si applicable)
type LinkedUserInfo {
  id: ID!
  email: String!
  name: String
  firstName: String
  lastName: String
  image: String
}

# Accès à un board spécifique
type BoardAccess {
  id: ID!
  boardId: ID!
  shareId: ID!
  workspaceId: ID!
  grantedAt: DateTime!
  lastVisitAt: DateTime!
  visitCount: Int!
  status: BoardAccessStatus!
  banReason: String
  bannedAt: DateTime
}

# Statut d'accès à un board
enum BoardAccessStatus {
  active
  banned
  pending
}

# Statistiques de l'utilisateur invité
type UserInvitedStats {
  totalVisits: Int!
  totalComments: Int!
  totalBoardsAccessed: Int!
}

# Résultat de l'authentification d'un utilisateur invité
type AuthInvitedResult {
  success: Boolean!
  message: String
  userInvited: UserInvited
  sessionToken: String
  isNewUser: Boolean
  requiresPassword: Boolean
  linkedUser: LinkedUserInfo
  isBanned: Boolean
  banReason: String
  # Adresse à prouver : code envoyé par requestInvitedEmailCode, à renvoyer
  # dans emailCode
  requiresEmailCode: Boolean
}

# Résultat de l'envoi d'un code de vérification
type RequestInvitedCodeResult {
  success: Boolean!
  message: String
}

# Résultat de la vérification d'un email. Avant toute preuve de l'adresse,
# linkedUser et userInvited sont toujours null et hasLinkedNewbiAccount faux ;
# requiresPassword n'est vrai que si la connexion par mot de passe est
# possible (adresse déjà vérifiée)
type CheckEmailResult {
  exists: Boolean!
  requiresPassword: Boolean!
  hasLinkedNewbiAccount: Boolean!
  linkedUser: LinkedUserInfo
  userInvited: UserInvited
}

# Input pour l'authentification : l'adresse est prouvée par emailCode (code
# reçu par e-mail), ou par password pour un compte dont l'adresse a déjà été
# vérifiée. skipPassword n'a plus d'effet.
input AuthInvitedInput {
  token: String!
  email: String!
  password: String
  skipPassword: Boolean
  firstName: String
  lastName: String
  emailCode: String
}

# Input pour la mise à jour du profil
input UpdateInvitedProfileInput {
  firstName: String
  lastName: String
  image: String
}

# Input pour définir un mot de passe
input SetPasswordInput {
  email: String!
  currentPassword: String
  newPassword: String!
  # Session visiteur du compte (obligatoire)
  sessionToken: String
}

# Queries
type Query {
  # Vérifier si un email existe et ses caractéristiques
  checkInvitedEmail(email: String!, token: String!): CheckEmailResult!
  
  # Récupérer un utilisateur invité par son ID (membres d'un espace où il a
  # accès à un tableau, lecture du kanban ; null sinon)
  getInvitedUser(id: ID!): UserInvited
  
  # Récupérer un utilisateur invité par son email (mêmes règles)
  getInvitedUserByEmail(email: String!): UserInvited
  
  # Récupérer tous les utilisateurs invités ayant accès à un board
  getInvitedUsersForBoard(boardId: ID!, workspaceId: ID): [UserInvited!]!
  
  # Valider une session visiteur (jeton remis par authenticateInvitedUser)
  validateInvitedSession(sessionToken: String!): UserInvited
}

# Mutations
type Mutation {
  # Envoyer un code de vérification à l'adresse d'un visiteur (10 min)
  requestInvitedEmailCode(token: String!, email: String!): RequestInvitedCodeResult!

  # Authentifier ou créer un utilisateur invité
  authenticateInvitedUser(input: AuthInvitedInput!): AuthInvitedResult!
  
  # Définir ou modifier le mot de passe d'un utilisateur invité
  setInvitedUserPassword(input: SetPasswordInput!): AuthInvitedResult!
  
  # Supprimer le mot de passe (passer en mode sans mot de passe)
  removeInvitedUserPassword(email: String!, currentPassword: String!): AuthInvitedResult!
  
  # Mettre à jour le profil d'un utilisateur invité : l'invité lui-même
  # (sessionToken) ou un membre ayant le droit de partager un tableau dans un
  # espace où l'invité a accès (workspaceId pour cibler cet espace)
  updateInvitedUserProfile(
    email: String!
    input: UpdateInvitedProfileInput!
    sessionToken: String
    workspaceId: ID
  ): UserInvited!
  
  # Uploader une image de profil pour un utilisateur invité
  uploadInvitedUserImage(
    email: String!
    file: Upload!
  ): UserInvited!
  
  # Bannir un utilisateur invité d'un board
  banInvitedUserFromBoard(
    userInvitedId: ID!
    boardId: ID!
    reason: String
    workspaceId: ID
  ): UserInvited!
  
  # Débannir un utilisateur invité d'un board
  unbanInvitedUserFromBoard(
    userInvitedId: ID!
    boardId: ID!
    workspaceId: ID
  ): UserInvited!
  
  # Déconnecter un utilisateur invité (invalider la session)
  logoutInvitedUser(sessionToken: String!): Boolean!
  
  # Lier son propre compte Newbi à l'invité de la même adresse e-mail
  # (ou administrateur du back-office)
  linkInvitedUserToNewbi(
    userInvitedId: ID!
    newbiUserId: ID!
  ): UserInvited!
}
