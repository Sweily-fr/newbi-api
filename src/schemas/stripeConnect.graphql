# Types pour l'intégration Stripe Connect

# Type pour représenter un compte Stripe Connect
type StripeConnectAccount {
  id: ID!
  # Membre qui a connecté le compte (absent sur de très anciens comptes)
  userId: ID
  accountId: String!
  isOnboarded: Boolean!
  chargesEnabled: Boolean!
  payoutsEnabled: Boolean!
  # « oauth » : compte Stripe du client (paiements créés sur son compte,
  # rien ne passe par Newbi) ; « express » : ancien parcours
  connectionType: String
  displayName: String
  accountEmail: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Moyens d'encaissement de l'espace (réglages, transferts payants)
type PaymentConnections {
  stripe: StripePaymentConnection!
  paypal: PaypalPaymentConnection!
  sumup: SumupPaymentConnection!
  bankTransfer: BankTransferPaymentConnection!
}

type StripePaymentConnection {
  # Un compte Stripe est rattaché à l'espace (tous parcours)
  connected: Boolean!
  # Compte du client connecté par OAuth et prêt à encaisser (transferts)
  ready: Boolean!
  # Connecté par l'ancien parcours (Express) : à reconnecter pour les transferts
  legacy: Boolean!
  # « Connecter mon compte Stripe » possible pour cet espace
  oauthAvailable: Boolean!
  chargesEnabled: Boolean!
  displayName: String
  accountEmail: String
}

type PaypalPaymentConnection {
  # PayPal configuré côté Newbi et ouvert à l'espace
  available: Boolean!
  connected: Boolean!
  email: String
}

type SumupPaymentConnection {
  # SumUp configuré côté Newbi et ouvert à l'espace
  available: Boolean!
  connected: Boolean!
  # Accès retiré ou expiré côté SumUp : le compte est à reconnecter
  needsReconnect: Boolean!
  businessName: String
  email: String
  merchantCode: String
  # Devise du compte marchand : seule devise que SumUp encaisse pour lui
  currency: String
}

type BankTransferPaymentConnection {
  # IBAN renseigné dans les informations de l'entreprise
  available: Boolean!
  ibanLast4: String
  # Compte bancaire connecté à Newbi : les virements des transferts y sont
  # repérés et débloquent le transfert tout seuls
  autoDetect: Boolean!
}

# Annonce d'un virement par le payeur d'un transfert
type TransferBankDeclarationResponse {
  success: Boolean!
  message: String
  declaredAt: Date
  # Adresse masquée qui recevra le lien au déblocage
  notifyEmailHint: String
}

type PaypalConnectionResponse {
  success: Boolean!
  message: String
  email: String
}

type SumupConnectionResponse {
  success: Boolean!
  message: String
}

# Retour du payeur après un paiement en ligne
type TransferPaymentConfirmation {
  success: Boolean!
  message: String
  # paid | pending | unpaid
  status: String
  shareLink: String
  accessKey: String
}

# Type pour la réponse de création d'un compte Stripe Connect
type StripeConnectAccountResponse {
  success: Boolean!
  message: String
  accountId: String
}

# Type pour la réponse de génération d'un lien d'onboarding
type StripeOnboardingLinkResponse {
  success: Boolean!
  message: String
  url: String
}

# Type pour la réponse de vérification du statut d'un compte
type StripeConnectAccountStatusResponse {
  success: Boolean!
  message: String
  isOnboarded: Boolean!
  chargesEnabled: Boolean!
  payoutsEnabled: Boolean!
  accountStatus: String
}

# Type pour la réponse de création d'une session de paiement
type StripePaymentSessionResponse {
  success: Boolean!
  message: String
  sessionId: String
  sessionUrl: String
}

# Étendre le type Query
extend type Query {
  # Obtenir le compte Stripe Connect de l'utilisateur connecté
  myStripeConnectAccount: StripeConnectAccount

  # Moyens d'encaissement de l'espace actif
  paymentConnections: PaymentConnections!
}

# Étendre le type Mutation
extend type Mutation {
  # Créer un nouveau compte Stripe Connect pour l'utilisateur connecté
  createStripeConnectAccount: StripeConnectAccountResponse!

  # Générer un lien d'onboarding pour un compte Stripe Connect
  generateStripeOnboardingLink(
    accountId: String!
    returnUrl: String!
  ): StripeOnboardingLinkResponse!

  # Vérifier le statut d'un compte Stripe Connect
  checkStripeConnectAccountStatus(
    accountId: String!
  ): StripeConnectAccountStatusResponse!

  # Générer un lien de connexion au tableau de bord Stripe Express
  generateStripeDashboardLink(accountId: String!): StripeOnboardingLinkResponse!

  # Lancer le paiement d'un transfert (destinataire du lien) : provider
  # « stripe » (carte, défaut), « sumup » (carte, compte SumUp du vendeur)
  # ou « paypal » ; sessionUrl à ouvrir
  createPaymentSessionForFileTransfer(
    transferId: ID!
    accessKey: String
    provider: String
  ): StripePaymentSessionResponse!

  # Retour du payeur : paiement vérifié auprès du prestataire, transfert
  # débloqué s'il est payé
  confirmTransferPayment(
    token: String!
    provider: String
    sessionId: String
    orderId: String
  ): TransferPaymentConfirmation!

  # Ancien retour de Stripe (sessions ouvertes avant confirmTransferPayment)
  consumePaymentReturnToken(token: String!): PaymentReturnTokenResponse!

  # Page publique : le payeur annonce son virement (« J'ai fait le virement »),
  # ou retire son annonce avec cancel
  declareTransferBankPayment(
    transferId: ID!
    accessKey: String!
    email: String
    cancel: Boolean
  ): TransferBankDeclarationResponse!

  # Compte PayPal Business de l'espace (adresse e-mail seule)
  connectPaypal(email: String!): PaypalConnectionResponse!
  disconnectPaypal: PaypalConnectionResponse!

  # Compte SumUp de l'espace (connexion par OAuth : GET /sumup/authorize)
  disconnectSumup: SumupConnectionResponse!
}

type PaymentReturnTokenResponse {
  success: Boolean!
  message: String
  shareLink: String
  accessKey: String
  paymentStatus: String
}
