# Signatures de mail v2
#
# Le HTML n'est jamais stocké : `renderEmailSignatureV2` le régénère à partir
# des données, pour l'aperçu comme pour la copie. Les valeurs de choix
# (modèle, police, forme…) sont des String validées côté serveur, pour
# pouvoir en ajouter sans casser le schéma.

type SignatureImageV2 {
  url: String!
  key: String
  width: Int
  height: Int
}

type SignatureSocialV2 {
  network: String!
  url: String!
}

type SignatureIdentityV2 {
  firstName: String!
  lastName: String!
  jobTitle: String!
  department: String!
  company: String!
  tagline: String!
}

type SignatureContactV2 {
  email: String!
  phone: String!
  mobile: String!
  website: String!
  address: String!
}

type SignatureImagesV2 {
  photo: SignatureImageV2
  logo: SignatureImageV2
  banner: SignatureImageV2
}

type SignatureCtaV2 {
  enabled: Boolean!
  label: String!
  url: String!
  backgroundColor: String!
  textColor: String!
}

type SignatureBannerV2 {
  enabled: Boolean!
  url: String!
  alt: String!
}

type SignatureDisclaimerV2 {
  enabled: Boolean!
  text: String!
}

"""
Mise en forme propre à un élément de texte. Un champ vide = comme le modèle.
"""
type SignatureTextStyleV2 {
  fontFamily: String
  fontSize: Int
  color: String
  bold: Boolean
  italic: Boolean
  uppercase: Boolean
}

type SignatureElementStylesV2 {
  name: SignatureTextStyleV2
  jobTitle: SignatureTextStyleV2
  company: SignatureTextStyleV2
  tagline: SignatureTextStyleV2
  contact: SignatureTextStyleV2
  cta: SignatureTextStyleV2
  disclaimer: SignatureTextStyleV2
}

type SignatureStyleV2 {
  fontFamily: String!
  fontSize: Int!
  primaryColor: String!
  textColor: String!
  mutedColor: String!
  photoShape: String!
  photoSize: Int!
  logoWidth: Int!
  iconStyle: String!
  iconColorMode: String!
  iconColor: String!
  iconSize: Int!
  showContactIcons: Boolean!
  separatorColor: String!
  spacing: String!
  align: String!
  """
  Encadré de toute la signature : none, outline, soft, accent-left, accent-top.
  """
  frame: String!
  "Couleur de l'encadré ; vide = déduite de la couleur principale."
  frameColor: String!
  "Arrondi des encadrés et blocs de couleur, en px (0-24)."
  radius: Int!
  "Épaisseur du contour de la photo, en px (0-6)."
  photoBorder: Int!
  "Couleur du contour de la photo ; vide = couleur principale."
  photoBorderColor: String!
  """
  Mise en page (valeurs effectives : celles du modèle quand rien n'a été
  choisi). Valeurs possibles : voir LAYOUT_CHOICES côté générateur.
  """
  identityZone: String!
  photoPosition: String!
  photoValign: String!
  photoColumn: String!
  divider: String!
  accent: String!
  identityStyle: String!
  titleStyle: String!
  contactStyle: String!
  socialPosition: String!
  logoPosition: String!
  "Bande teintée en bas du cadre (réseaux, logo)."
  footerStrip: Boolean!
  "Éléments placés en dehors de l'encadré : social, logo, cta, banner, disclaimer."
  outside: [String!]!
  """
  Réglages par élément (seulement ceux modifiés).
  """
  elements: SignatureElementStylesV2!
}

type EmailSignatureV2 {
  id: ID!
  name: String!
  isDefault: Boolean!
  templateId: String!
  identity: SignatureIdentityV2!
  contact: SignatureContactV2!
  social: [SignatureSocialV2!]!
  images: SignatureImagesV2!
  cta: SignatureCtaV2!
  banner: SignatureBannerV2!
  disclaimer: SignatureDisclaimerV2!
  style: SignatureStyleV2!
  """
  Membre de l'espace dont la signature reprend les informations (profil et
  photo). Vide pour les signatures migrées de la v1.
  """
  memberUserId: ID
  """
  Rendu à jour de la signature (HTML, texte, taille, avertissements).
  """
  render: SignatureRenderV2!
  createdAt: DateTime
  updatedAt: DateTime
}

"""
Résultat d'un rendu : le HTML à coller, sa version texte, sa taille et les
avertissements de compatibilité (limite Gmail, logo JPEG…).
"""
type SignatureRenderV2 {
  html: String!
  """
  Même HTML avec, sur chaque élément, l'identifiant du champ qui le pilote
  (data-sig-field). Réservé à l'aperçu de l'éditeur, jamais à copier.
  """
  previewHtml: String!
  text: String!
  chars: Int!
  warnings: [String!]!
  """
  Style effectivement appliqué à chaque élément de texte affiché (modèle +
  réglages), pour les valeurs des contrôles de l'éditeur.
  """
  elements: SignatureElementStylesV2!
}

type SignatureTemplateSupportsV2 {
  photo: Boolean!
  logo: Boolean!
  align: Boolean!
  "Faux quand le modèle dessine déjà son propre cadre."
  frame: Boolean!
}

"""
Typographie et formes propres à un modèle, appliquées quand on le choisit.
Les couleurs n'en font jamais partie.
"""
type SignatureTemplatePresetV2 {
  fontFamily: String
  fontSize: Int
  photoShape: String
  photoSize: Int
  logoWidth: Int
  iconStyle: String
  iconSize: Int
  spacing: String
  showContactIcons: Boolean
}

type SignatureTemplateV2 {
  id: String!
  name: String!
  description: String!
  supports: SignatureTemplateSupportsV2!
  preset: SignatureTemplatePresetV2!
  """
  Tous les réglages de départ du modèle (typographie, formes, mise en page),
  à appliquer au style quand on le choisit.
  """
  defaults: JSON!
}

type SignatureSocialNetworkV2 {
  id: String!
  label: String!
  brandColor: String!
  host: String!
}

"""
Membre de l'espace proposé comme personne de la signature.
"""
type SignatureMemberV2 {
  userId: ID!
  name: String!
  email: String!
  image: String
  isMe: Boolean!
}

type SignatureFontV2 {
  id: String!
  label: String!
  stack: String!
}

"""
Référentiel de l'éditeur : modèles, réseaux, polices et limites.
"""
type SignatureCatalogV2 {
  templates: [SignatureTemplateV2!]!
  networks: [SignatureSocialNetworkV2!]!
  fonts: [SignatureFontV2!]!
  gmailMaxChars: Int!
}

input SignatureSocialV2Input {
  network: String!
  url: String!
}

input SignatureIdentityV2Input {
  firstName: String
  lastName: String
  jobTitle: String
  department: String
  company: String
  tagline: String
}

input SignatureContactV2Input {
  email: String
  phone: String
  mobile: String
  website: String
  address: String
}

input SignatureCtaV2Input {
  enabled: Boolean
  label: String
  url: String
  backgroundColor: String
  textColor: String
}

input SignatureBannerV2Input {
  enabled: Boolean
  url: String
  alt: String
}

input SignatureDisclaimerV2Input {
  enabled: Boolean
  text: String
}

input SignatureTextStyleV2Input {
  fontFamily: String
  fontSize: Int
  color: String
  bold: Boolean
  italic: Boolean
  uppercase: Boolean
}

input SignatureElementStylesV2Input {
  name: SignatureTextStyleV2Input
  jobTitle: SignatureTextStyleV2Input
  company: SignatureTextStyleV2Input
  tagline: SignatureTextStyleV2Input
  contact: SignatureTextStyleV2Input
  cta: SignatureTextStyleV2Input
  disclaimer: SignatureTextStyleV2Input
}

input SignatureStyleV2Input {
  fontFamily: String
  fontSize: Int
  primaryColor: String
  textColor: String
  mutedColor: String
  photoShape: String
  photoSize: Int
  logoWidth: Int
  iconStyle: String
  iconColorMode: String
  iconColor: String
  iconSize: Int
  showContactIcons: Boolean
  separatorColor: String
  spacing: String
  align: String
  frame: String
  frameColor: String
  radius: Int
  photoBorder: Int
  photoBorderColor: String
  identityZone: String
  photoPosition: String
  photoValign: String
  photoColumn: String
  divider: String
  accent: String
  identityStyle: String
  titleStyle: String
  contactStyle: String
  socialPosition: String
  logoPosition: String
  footerStrip: Boolean
  outside: [String!]
  """
  Remplace l'ensemble des réglages par élément (envoyer l'objet complet).
  """
  elements: SignatureElementStylesV2Input
}

"""
Contenu d'une signature. Les images ne se passent pas ici : elles sont
envoyées par `uploadEmailSignatureV2Image` et rattachées au document.
"""
input EmailSignatureV2Input {
  name: String
  templateId: String
  identity: SignatureIdentityV2Input
  contact: SignatureContactV2Input
  social: [SignatureSocialV2Input!]
  cta: SignatureCtaV2Input
  banner: SignatureBannerV2Input
  disclaimer: SignatureDisclaimerV2Input
  style: SignatureStyleV2Input
}

enum SignatureImageKindV2 {
  PHOTO
  LOGO
  BANNER
}

extend type Query {
  emailSignaturesV2: [EmailSignatureV2!]!
  emailSignatureV2(id: ID!): EmailSignatureV2
  signatureCatalogV2: SignatureCatalogV2!
  signatureMembersV2: [SignatureMemberV2!]!

  """
  Rendu d'une signature non enregistrée (aperçu en direct). Sans `id`, les
  images du document ne sont pas connues : passer `id` pour les inclure.
  """
  renderEmailSignatureV2(input: EmailSignatureV2Input!, id: ID): SignatureRenderV2!

  """
  Rendu d'un modèle avec des données d'exemple (vignettes de la galerie).
  """
  renderSignatureTemplateV2(templateId: String!, style: SignatureStyleV2Input): SignatureRenderV2!
}

extend type Mutation {
  """
  Crée une signature pré-remplie avec le profil de `memberUserId` (soi-même
  par défaut) et l'entreprise de l'espace ; `input` l'emporte.
  """
  createEmailSignatureV2(
    input: EmailSignatureV2Input!
    memberUserId: ID
  ): EmailSignatureV2!

  """
  Reprend les informations d'un membre de l'espace : nom, e-mail, portable
  et photo remplacés ; société, standard, site et adresse complétés s'ils
  sont vides.
  """
  applyMemberToEmailSignatureV2(id: ID!, memberUserId: ID!): EmailSignatureV2!
  updateEmailSignatureV2(id: ID!, input: EmailSignatureV2Input!): EmailSignatureV2!
  deleteEmailSignatureV2(id: ID!): Boolean!
  duplicateEmailSignatureV2(id: ID!): EmailSignatureV2!
  setDefaultEmailSignatureV2(id: ID!): EmailSignatureV2!

  """
  Envoie et traite une image (recadrage, retina, transparence conservée),
  puis la rattache à la signature.
  """
  uploadEmailSignatureV2Image(
    id: ID!
    kind: SignatureImageKindV2!
    file: Upload!
  ): EmailSignatureV2!

  removeEmailSignatureV2Image(id: ID!, kind: SignatureImageKindV2!): EmailSignatureV2!
}
