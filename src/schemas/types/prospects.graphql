"Origine d'une fiche client créée depuis « Générer des prospects »"
type ClientProspect {
  provider: String!
  siren: String
  unlockedAt: String
  activityLabel: String
  website: String
  "Date de création de l'entreprise (AAAA-MM-JJ)"
  companyCreatedAt: String
}

extend type Client {
  "Renseigné seulement pour un prospect généré"
  prospect: ClientProspect
}

"Métier courant proposé en tête de la recherche de prospects"
type ProspectTrade {
  id: String!
  label: String!
  "Codes NAF recherchés pour ce métier (ex. 4332A)"
  nafCodes: [String!]!
}

"""
Entreprises actives au registre public pour ces activités et cette zone
(gratuit, ordre de grandeur : le nombre joignable par téléphone ou email
est plus bas)
"""
type ProspectCount {
  "null si le registre ne répond pas ou si une zone n'a pas pu être traduite"
  total: Int
  "Le registre plafonne ses totaux à 10 000"
  capped: Boolean!
}

"Sous-classe de la nomenclature NAF rév. 2 (Insee)"
type ProspectActivity {
  "Code sans point (ex. 4776Z)"
  code: String!
  label: String!
}

"Lieu (région, département, ville…) suggéré par le fournisseur"
type ProspectPlace {
  id: String!
  label: String!
  type: String
}

"Prospects offerts à l'espace"
type ProspectQuota {
  "Plan payé (freelance, pme, entreprise), null pendant l'essai"
  plan: String
  "monthly (TPE, Entreprise) ou welcome (Freelance, une seule fois)"
  bucket: String
  quota: Int!
  used: Int!
  remaining: Int!
  "Réellement disponible : le plus petit du quota restant, des crédits du fournisseur et du budget de Newbi"
  available: Int!
  "Remise à zéro du quota mensuel"
  resetsAt: String
}

type ProspectSettings {
  "Fonctionnalité ouverte (accord fournisseur signé et clé configurée)"
  enabled: Boolean!
  trades: [ProspectTrade!]!
  quota: ProspectQuota!
  maxPerUnlock: Int!
  "Pages de recherche parcourues au plus par génération (1 crédit chacune)"
  maxSearchPages: Int!
  "Codes NAF au plus par recherche"
  maxNafCodes: Int!
}

"Aperçu d'une entreprise, sans ses coordonnées"
type ProspectPreview {
  siren: String!
  siret: String
  name: String!
  activity: String
  postalCode: String
  city: String
  "Déjà dans les clients de l'espace : son ajout ne coûte rien"
  alreadyInClients: Boolean!
  clientId: ID
}

type ProspectSearchResult {
  total: Int!
  page: Int!
  totalPages: Int!
  pageSize: Int!
  results: [ProspectPreview!]!
  quota: ProspectQuota!
}

input ProspectPlaceInput {
  id: String!
  label: String!
  type: String
}

input ProspectSearchInput {
  "Identifiants de ProspectTrade"
  tradeIds: [String!]
  "Codes NAF supplémentaires (ex. 4332A)"
  nafCodes: [String!]
  "Identifiants de ProspectPlace (5 au plus), ignorés avec un rayon"
  placeIds: [String!]
  "Rayon autour de aroundPlace : 5, 10, 20, 30 ou 50 km (0 ou absent : sans rayon)"
  radiusKm: Int
  "Ville ou code postal au centre du rayon, tel que renvoyé par prospectPlaces"
  aroundPlace: ProspectPlaceInput
  "phone, email ou both"
  contact: String
  minStaff: Int
  maxStaff: Int
  "Entreprises créées à partir de cette date (AAAA-MM-JJ)"
  createdAfter: String
  "Entreprises créées jusqu'à cette date (AAAA-MM-JJ)"
  createdBefore: String
  page: Int
}

"Entreprise non ajoutée, avec la raison"
type ProspectSkipped {
  siren: String!
  "ALREADY_IN_CLIENTS, OPPOSED_TO_PROSPECTING, COMPANY_CLOSED, VERIFICATION_UNAVAILABLE, QUOTA_EXCEEDED, CLIENT_NOT_CREATED…"
  reason: String!
  message: String
}

type ProspectUnlockResult {
  clients: [Client!]!
  "Fiches débloquées (décomptées du quota)"
  unlockedCount: Int!
  "Crédits dépensés chez le fournisseur (fiches lues)"
  creditsUsed: Int!
  skipped: [ProspectSkipped!]!
  listId: ID
  quota: ProspectQuota!
  "Arrêt en cours de route côté fournisseur (les fiches déjà ajoutées restent)"
  providerError: String
}

"Bilan d'une génération par nombre"
type ProspectGenerationResult {
  "Nombre demandé"
  requested: Int!
  "Entreprises correspondant aux critères chez le fournisseur"
  matching: Int!
  "Entreprises écartées car opposées à la prospection"
  opposedCount: Int!
  "Entreprises écartées car cessées au registre"
  closedCount: Int!
  "Entreprises trouvées hors du rayon, écartées sans frais de fiche"
  outOfRadiusCount: Int!
  "Rayon réellement couvert en km (réduit autour des grandes villes), null sans rayon"
  radiusKm: Int
  "Pages de recherche parcourues (1 crédit chacune)"
  searchCredits: Int!
  "Crédits dépensés au total : pages de recherche + fiches lues"
  creditsUsed: Int!
  clients: [Client!]!
  unlockedCount: Int!
  skipped: [ProspectSkipped!]!
  listId: ID
  quota: ProspectQuota!
  providerError: String
}

extend type Query {
  prospectSettings(workspaceId: String!): ProspectSettings!
  prospectPlaces(workspaceId: String!, query: String!): [ProspectPlace!]!
  "Compteur gratuit avant de lancer (aucun crédit Societeinfo)"
  prospectCount(
    workspaceId: String!
    input: ProspectSearchInput!
    "Zones choisies (libellé et type), pour les traduire en codes du registre"
    places: [ProspectPlaceInput!]
  ): ProspectCount!
  "Toutes les activités NAF, pour la recherche par activité"
  prospectActivities(workspaceId: String!): [ProspectActivity!]!
}

extend type Mutation {
  """
  Une page de résultats. Mutation et non requête : chaque appel coûte un
  crédit, il ne doit jamais être relancé tout seul par le cache du site.
  """
  searchProspects(
    workspaceId: String!
    input: ProspectSearchInput!
  ): ProspectSearchResult!
  "Trouve et ajoute le nombre demandé de prospects correspondant aux critères"
  generateProspects(
    workspaceId: String!
    input: ProspectSearchInput!
    count: Int!
    listId: ID
    newListName: String
  ): ProspectGenerationResult!
  "Débloque les entreprises choisies et les ajoute aux clients (et à une liste)"
  unlockProspects(
    workspaceId: String!
    sirens: [String!]!
    listId: ID
    newListName: String
  ): ProspectUnlockResult!
}
