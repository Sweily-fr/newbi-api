type ChunkUploadR2Result {
  chunkReceived: Boolean!
  fileCompleted: Boolean!
  fileId: String!
  fileName: String
  filePath: String
  fileTransferId: String
  storageType: String!
}

type FileUploadR2Result {
  fileId: String!
  fileName: String!
  filePath: String!
  r2Key: String!
  size: Float!
  mimeType: String!
  storageType: String!
}

input Base64FileInputR2 {
  name: String!
  type: String!
  size: Float!
  base64: String!
}

type PresignedUploadUrl {
  chunkIndex: Int!
  uploadUrl: String!
  key: String!
}

type PresignedUploadUrlsResponse {
  fileId: String!
  transferId: String!
  uploadUrls: [PresignedUploadUrl!]!
  expiresIn: Int!
}

type MultipartUploadUrl {
  partNumber: Int!
  uploadUrl: String!
}

type StartMultipartUploadResponse {
  uploadId: String!
  key: String!
  presignedUrls: [MultipartUploadUrl!]!
}

type CompleteMultipartUploadResponse {
  success: Boolean!
  key: String!
  url: String!
  size: Float!
  etag: String
  fileId: String!
}

input PartInput {
  partNumber: Int!
  etag: String!
}

# Part déjà reçue par R2 (ListParts)
type MultipartUploadPart {
  partNumber: Int!
  etag: String!
  size: Float!
}

# État d'un envoi multipart, pour reprendre un envoi interrompu
type ListMultipartUploadPartsResponse {
  # true : envoi déjà finalisé, le fichier est prêt (fileId)
  completed: Boolean!
  fileId: String
  # Nombre de parts annoncé au démarrage (null pour un envoi plus ancien)
  totalParts: Int
  # Parts reçues, triées par numéro (vide si completed)
  parts: [MultipartUploadPart!]!
}

extend type Mutation {
  # Démarrer un multipart upload natif S3/R2
  startMultipartUpload(
    transferId: String!
    fileId: String!
    fileName: String!
    fileSize: Float!
    mimeType: String
    totalParts: Int!
  ): StartMultipartUploadResponse!

  # Compléter un multipart upload
  completeMultipartUpload(
    uploadId: String!
    key: String!
    parts: [PartInput!]!
    transferId: String
    fileId: String!
  ): CompleteMultipartUploadResponse!

  # Annuler un multipart upload en cours (échec ou annulation de l'envoi).
  # true : annulé ; false : envoi inconnu (déjà finalisé, ou démarré il y a
  # plus de 24 h) ; erreur FORBIDDEN : envoi d'un autre utilisateur, d'un
  # autre espace ou clé différente
  abortMultipartUpload(uploadId: String!, key: String!): Boolean!

  # Reprendre un envoi interrompu : parts déjà reçues par R2. null : envoi
  # inconnu (démarré il y a plus de 24 h, annulé, ou avant cette version),
  # à recommencer ; erreur FORBIDDEN : envoi d'un autre utilisateur, d'un
  # autre espace ou clé différente
  listMultipartUploadParts(
    uploadId: String!
    key: String!
  ): ListMultipartUploadPartsResponse

  # Nouvelles URL présignées (12 h) pour des parts d'un envoi en cours, à la
  # reprise (celles du démarrage ont pu expirer). Mêmes contrôles que
  # completeMultipartUpload ; envoi inconnu ou déjà finalisé : FORBIDDEN
  refreshMultipartUploadUrls(
    uploadId: String!
    key: String!
    partNumbers: [Int!]!
  ): [MultipartUploadUrl!]!

  # Générer des URLs signées pour upload direct vers R2
  generatePresignedUploadUrls(
    fileId: String!
    totalChunks: Int!
    fileName: String!
  ): PresignedUploadUrlsResponse!

  # Confirmer qu'un chunk a été uploadé directement vers R2
  confirmChunkUploadedToR2(
    fileId: String!
    chunkIndex: Int!
    totalChunks: Int!
    fileName: String!
    fileSize: Float!
  ): ChunkUploadR2Result!

  # Upload d'un chunk vers Cloudflare R2
  uploadFileChunkToR2(
    chunk: Upload!
    fileId: String!
    chunkIndex: Int!
    totalChunks: Int!
    fileName: String!
    fileSize: Float!
  ): ChunkUploadR2Result!

  # Créer un transfert à partir d'IDs de fichiers R2
  createFileTransferWithIdsR2(
    fileIds: [String!]!
    input: FileTransferInput
  ): FileTransferResponse!

  # Upload direct d'un fichier vers R2
  uploadFileDirectToR2(file: Upload!, transferId: String): FileUploadR2Result!

  # Upload d'un fichier base64 vers R2
  uploadBase64FileToR2(
    fileInput: Base64FileInputR2!
    transferId: String
  ): FileUploadR2Result!
}
