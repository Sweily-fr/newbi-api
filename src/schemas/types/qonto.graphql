# === QONTO INTEGRATION TYPES ===

"""
Compte bancaire Qonto (snapshot récupéré via l'API)
"""
type QontoBankAccount {
  qontoId: String!
  slug: String
  name: String
  iban: String
  bic: String
  currency: String
  main: Boolean
  status: String
}

"""
Compte Qonto connecté à une organisation
"""
type QontoAccount {
  id: ID!
  organizationId: String!
  login: String!
  isConnected: Boolean!
  organizationName: String
  qontoOrganizationId: String
  slug: String
  environment: String!
  bankAccounts: [QontoBankAccount!]!
  selectedBankAccountId: String
  lastSyncAt: String
  syncStatus: String!
  syncError: String
  lastImportAt: String
  importError: String
  stats: QontoStats
  autoSync: QontoAutoSync
  createdAt: String!
  updatedAt: String!
}

"""
Statistiques de synchronisation Qonto
"""
type QontoStats {
  invoicesSynced: Int!
  expensesSynced: Int!
  clientsSynced: Int!
  quotesSynced: Int!
  clientInvoicesImported: Int!
  supplierInvoicesImported: Int!
  quotesImported: Int!
}

"""
Préférences de synchronisation automatique Qonto
"""
type QontoAutoSync {
  "Newbi → Qonto : factures clients"
  invoices: Boolean!
  "Newbi → Qonto : factures fournisseurs et dépenses"
  supplierInvoices: Boolean!
  "Newbi → Qonto : devis envoyés ou acceptés"
  quotes: Boolean!
  "Qonto → Newbi : factures clients créées dans Qonto"
  importClientInvoices: Boolean!
  "Qonto → Newbi : factures fournisseurs déposées dans Qonto"
  importSupplierInvoices: Boolean!
  "Qonto → Newbi : devis créés dans Qonto"
  importQuotes: Boolean!
}

"""
Résultat d'une opération Qonto
"""
type QontoResult {
  success: Boolean!
  message: String
  account: QontoAccount
}

"""
Résultat du test de connexion Qonto
"""
type QontoConnectionResult {
  success: Boolean!
  message: String
  organizationName: String
  organizationId: String
  slug: String
  bankAccounts: [QontoBankAccount!]
}

"""
Résultat de synchronisation d'une entité vers Qonto
"""
type QontoSyncResult {
  success: Boolean!
  message: String
  qontoId: String
}

"""
Résultat détaillé d'une synchronisation complète vers Qonto
"""
type QontoSyncAllResult {
  success: Boolean!
  message: String
  invoicesSynced: Int
  invoicesErrors: Int
  expensesSynced: Int
  expensesErrors: Int
  quotesSynced: Int
  quotesErrors: Int
}

"""
Input pour les préférences de sync automatique Qonto
"""
input QontoAutoSyncInput {
  invoices: Boolean
  supplierInvoices: Boolean
  quotes: Boolean
  importClientInvoices: Boolean
  importSupplierInvoices: Boolean
  importQuotes: Boolean
}

"""
Résultat d'un import Qonto → Newbi
"""
type QontoImportResult {
  success: Boolean!
  message: String
  clientInvoicesImported: Int
  clientInvoicesUpdated: Int
  clientInvoicesErrors: Int
  supplierInvoicesImported: Int
  supplierInvoicesUpdated: Int
  supplierInvoicesErrors: Int
  quotesImported: Int
  quotesUpdated: Int
  quotesErrors: Int
}

# === QUERIES ===

extend type Query {
  """
  Récupérer le compte Qonto de l'organisation active
  """
  myQontoAccount: QontoAccount

  """
  Indique si l'utilisateur peut connecter le sandbox Qonto (admins back-office
  uniquement, et token staging configuré côté serveur)
  """
  qontoSandboxAvailable: Boolean!
}

# === MUTATIONS ===

extend type Mutation {
  """
  Tester les identifiants Qonto (identifiant + clé secrète) sans sauvegarder
  """
  testQontoConnection(
    login: String!
    secretKey: String!
    environment: String
  ): QontoConnectionResult!

  """
  Connecter Qonto à l'organisation (sauvegarde les identifiants après test)
  """
  connectQonto(
    login: String!
    secretKey: String!
    environment: String
    bankAccountId: String
  ): QontoResult!

  """
  Déconnecter Qonto de l'organisation
  """
  disconnectQonto: QontoResult!

  """
  Mettre à jour les préférences de synchronisation automatique
  """
  updateQontoAutoSync(autoSync: QontoAutoSyncInput!): QontoResult!

  """
  Choisir le compte bancaire Qonto dont l'IBAN figure sur les factures
  """
  updateQontoBankAccount(bankAccountId: String!): QontoResult!

  """
  Rafraîchir la liste des comptes bancaires Qonto
  """
  refreshQontoBankAccounts: QontoResult!

  """
  Synchroniser une facture spécifique vers Qonto
  """
  syncInvoiceToQonto(invoiceId: ID!): QontoSyncResult!

  """
  Synchroniser une facture d'achat spécifique vers Qonto
  """
  syncPurchaseInvoiceToQonto(purchaseInvoiceId: ID!): QontoSyncResult!

  """
  Synchroniser une dépense spécifique vers Qonto
  """
  syncExpenseToQonto(expenseId: ID!): QontoSyncResult!

  """
  Synchroniser un devis spécifique vers Qonto
  """
  syncQuoteToQonto(quoteId: ID!): QontoSyncResult!

  """
  Lancer une synchronisation complète vers Qonto
  """
  syncAllToQonto: QontoSyncAllResult!

  """
  Importer maintenant les documents créés dans Qonto (factures clients et
  fournisseurs) vers Newbi
  """
  importFromQonto: QontoImportResult!
}
