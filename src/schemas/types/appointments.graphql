# Prise de rendez-vous (Communication) : page de réservation de
# l'utilisateur dans l'espace, types de rendez-vous et réservations. Chaque
# utilisateur ne voit et ne modifie que les siens.

enum AppointmentLocationKind {
  GOOGLE_MEET
  TEAMS
  CUSTOM_LINK
  PHONE
  IN_PERSON
}

enum BookingStatus {
  CONFIRMED
  CANCELLED
}

"Créneau (prise de rendez-vous) ou événement (billetterie)"
enum AppointmentTypeKind {
  SLOT
  EVENT
}

"Paiement d'un événement payant : tout en ligne, acompte en ligne et le reste sur place, ou tout sur place"
enum EventPaymentMode {
  ONLINE
  DEPOSIT
  ON_SITE
}

enum EventRegistrationStatus {
  PENDING_PAYMENT
  CONFIRMED
  CANCELLED
  EXPIRED
}

enum TicketCheckInResult {
  "Billet valide, marqué présent à l'instant"
  VALID
  "Déjà scanné (ticket.checkedInAt = premier passage)"
  ALREADY_CHECKED_IN
  "Inscription annulée ou expirée"
  CANCELLED
  "Inscription en attente de paiement"
  NOT_PAID
  "Billet d'un autre de vos événements"
  OTHER_EVENT
  "Code illisible, billet inexistant ou d'un autre organisateur"
  UNKNOWN
}

"COVER : image de fond (bandeau) ; IMAGE : image de l'événement"
enum EventImageKind {
  COVER
  IMAGE
}

"Montant en centimes"
type Money {
  amount: Int!
  currency: String!
}

type AvailabilityInterval {
  "Heure locale HH:mm (fuseau de la page)"
  start: String!
  "Heure locale HH:mm, 24:00 pour minuit"
  end: String!
}

type AvailabilityDay {
  "Jour ISO : 1 = lundi … 7 = dimanche"
  dayOfWeek: Int!
  intervals: [AvailabilityInterval!]!
}

type AvailabilityOverride {
  "Jour AAAA-MM-JJ ; aucune plage = jour fermé"
  date: String!
  intervals: [AvailabilityInterval!]!
}

type AppointmentLocation {
  kind: AppointmentLocationKind!
  "Lien https (CUSTOM_LINK), adresse (IN_PERSON) ou précision (PHONE)"
  value: String
}

type BookingPage {
  id: ID!
  slug: String!
  title: String!
  description: String
  accentColor: String
  avatarUrl: String
  timezone: String!
  isActive: Boolean!
  availability: [AvailabilityDay!]!
  dateOverrides: [AvailabilityOverride!]!
  writeConnectionId: ID
  busyConnectionIds: [ID!]!
  "https://www.newbi.fr/rdv/<slug>"
  publicUrl: String!
  createdAt: DateTime
  updatedAt: DateTime
}

type AppointmentType {
  id: ID!
  slug: String!
  name: String!
  description: String
  durationMinutes: Int!
  slotIntervalMinutes: Int!
  location: AppointmentLocation!
  bufferBeforeMinutes: Int!
  bufferAfterMinutes: Int!
  minNoticeMinutes: Int!
  maxDaysAhead: Int!
  maxPerDay: Int
  color: String
  position: Int!
  isActive: Boolean!
  requirePhone: Boolean!
  "https://www.newbi.fr/rdv/<slug de la page>/<slug du type>"
  publicUrl: String!
  "Réservations confirmées à venir (événement : inscriptions confirmées s'il n'est pas passé)"
  upcomingCount: Int!
  kind: AppointmentTypeKind!
  "Événement seulement (null pour un créneau)"
  startAt: DateTime
  endAt: DateTime
  "Texte long, sauts de ligne gardés, à rendre en texte"
  details: String
  coverImageUrl: String
  imageUrl: String
  "Null = illimité"
  capacity: Int
  "Places prises : confirmées et en attente de paiement"
  seatsTaken: Int!
  "Null = illimité"
  seatsLeft: Int
  maxPerOrder: Int!
  "Null = début de l'événement"
  registrationClosesAt: DateTime
  "Prix d'un billet (null = gratuit)"
  price: Money
  "Événement payant : ONLINE, DEPOSIT ou ON_SITE (null pour un gratuit ou un créneau)"
  paymentMode: EventPaymentMode
  "Acompte par place en centimes (DEPOSIT seulement, sinon null)"
  depositAmount: Int
  "Inscriptions confirmées"
  registrationsCount: Int!
  "Billets des inscriptions confirmées"
  ticketsCount: Int!
  "Billets marqués présents"
  checkedInCount: Int!
}

type EventRegistrationBuyer {
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  timezone: String
}

type EventTicket {
  id: ID!
  "« EVT-7K3M9Q »"
  number: String!
  attendeeName: String!
  checkedInAt: DateTime
  checkedInBy: ID
}

type EventRegistration {
  id: ID!
  appointmentTypeId: ID
  eventName: String!
  eventStartAt: DateTime!
  eventEndAt: DateTime!
  buyer: EventRegistrationBuyer!
  quantity: Int!
  "Total dû en centimes, prix × quantité (0 = gratuit)"
  amount: Int!
  currency: String!
  "Montant à payer en ligne (acompte ou total ; 0 sur place ou gratuit)"
  amountOnline: Int!
  "Montant à régler sur place (le dû, qu'il soit réglé ou non : voir onSitePaidAt)"
  amountDueOnSite: Int!
  "Reste réglé sur place, marqué par l'organisateur"
  onSitePaidAt: DateTime
  "ONLINE, DEPOSIT ou ON_SITE (null si gratuite)"
  paymentMode: EventPaymentMode
  status: EventRegistrationStatus!
  "stripe, paypal, sumup ou null"
  paymentProvider: String
  paidAt: DateTime
  "En attente de paiement : fin de la réservation des places"
  expiresAt: DateTime
  "GUEST ou HOST"
  cancelledBy: String
  cancelledAt: DateTime
  cancelReason: String
  "Paiement arrivé sans place disponible : remboursé automatiquement"
  refundedAt: DateTime
  "Paiement arrivé sans place, remboursement automatique impossible : à rembourser à la main"
  refundFailed: Boolean!
  clientId: ID
  tickets: [EventTicket!]!
  checkedInCount: Int!
  createdAt: DateTime
}

type EventRegistrationList {
  items: [EventRegistration!]!
  totalCount: Int!
}

type TicketCheckIn {
  result: TicketCheckInResult!
  "Null pour UNKNOWN et OTHER_EVENT"
  ticket: EventTicket
  registration: EventRegistration
  "OTHER_EVENT seulement"
  otherEventName: String
}

type BookingGuest {
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  message: String
  timezone: String
}

type Booking {
  id: ID!
  appointmentTypeId: ID
  typeName: String!
  durationMinutes: Int!
  location: AppointmentLocation!
  startAt: DateTime!
  endAt: DateTime!
  status: BookingStatus!
  guest: BookingGuest!
  meetingUrl: String
  meetingWarning: String
  "GUEST ou HOST"
  cancelledBy: String
  cancelReason: String
  cancelledAt: DateTime
  clientId: ID
  eventId: ID
  createdAt: DateTime
}

type BookingList {
  items: [Booking!]!
  totalCount: Int!
}

input AvailabilityIntervalInput {
  start: String!
  end: String!
}

input AvailabilityDayInput {
  dayOfWeek: Int!
  intervals: [AvailabilityIntervalInput!]!
}

input AvailabilityOverrideInput {
  date: String!
  intervals: [AvailabilityIntervalInput!]!
}

input AppointmentLocationInput {
  kind: AppointmentLocationKind!
  value: String
}

input BookingPageInput {
  slug: String
  title: String
  description: String
  accentColor: String
  avatarUrl: String
  timezone: String
  isActive: Boolean
  availability: [AvailabilityDayInput!]
  dateOverrides: [AvailabilityOverrideInput!]
  writeConnectionId: ID
  busyConnectionIds: [ID!]
}

input AppointmentTypeInput {
  slug: String
  name: String
  description: String
  durationMinutes: Int
  slotIntervalMinutes: Int
  location: AppointmentLocationInput
  bufferBeforeMinutes: Int
  bufferAfterMinutes: Int
  minNoticeMinutes: Int
  maxDaysAhead: Int
  maxPerDay: Int
  color: String
  position: Int
  isActive: Boolean
  requirePhone: Boolean
  "À la création seulement (SLOT par défaut)"
  kind: AppointmentTypeKind
  startAt: DateTime
  endAt: DateTime
  details: String
  "URL renvoyée par uploadAppointmentEventImage, null pour retirer"
  coverImageUrl: String
  imageUrl: String
  "1 à 100 000, null = illimité"
  capacity: Int
  "1 à 10"
  maxPerOrder: Int
  "Null = début de l'événement"
  registrationClosesAt: DateTime
  "Null ou 0 = gratuit ; 50 à 1 000 000 centimes"
  price: MoneyInput
  "Événement payant : ONLINE (défaut), DEPOSIT ou ON_SITE"
  paymentMode: EventPaymentMode
  "Centimes par place, DEPOSIT seulement (au moins 50, inférieur au prix) ; null pour retirer"
  depositAmount: Int
}

input MoneyInput {
  "Centimes"
  amount: Int!
  "EUR (défaut)"
  currency: String
}

extend type Query {
  "Page de réservation de l'utilisateur dans l'espace (null avant sa création)"
  myBookingPage(workspaceId: ID): BookingPage
  appointmentTypes(workspaceId: ID): [AppointmentType!]!
  """
  Réservations de l'utilisateur. scope : « upcoming » (défaut, à venir, tri
  croissant), « past » (passées, tri décroissant) ou « all »
  """
  bookings(
    workspaceId: ID
    scope: String
    status: BookingStatus
    limit: Int
    offset: Int
  ): BookingList!
  booking(id: ID!, workspaceId: ID): Booking
  "Adresse de page libre (format valide, non réservée, non prise)"
  bookingSlugAvailable(slug: String!, workspaceId: ID): Boolean!
  """
  Inscrits d'un événement, plus récentes d'abord. search : nom, e-mail ou
  numéro de billet. status absent : toutes sauf EXPIRED
  """
  eventRegistrations(
    workspaceId: ID
    typeId: ID!
    search: String
    status: EventRegistrationStatus
    limit: Int
    offset: Int
  ): EventRegistrationList!
  "Export CSV (séparateur ;, UTF-8 avec BOM, un billet par ligne, inscriptions confirmées)"
  eventRegistrationsCsv(workspaceId: ID, typeId: ID!): String!
  "Moyens de paiement en ligne prêts pour vendre des billets (stripe, paypal, sumup)"
  eventPaymentMethods(workspaceId: ID): [String!]!
}

extend type Mutation {
  """
  Crée (premier appel : slug obligatoire, type par défaut « Rendez-vous de
  30 min » ajouté) ou modifie la page de réservation de l'utilisateur
  """
  upsertBookingPage(workspaceId: ID, input: BookingPageInput!): BookingPage!
  createAppointmentType(
    workspaceId: ID
    input: AppointmentTypeInput!
  ): AppointmentType!
  updateAppointmentType(
    id: ID!
    workspaceId: ID
    input: AppointmentTypeInput!
  ): AppointmentType!
  "Les réservations à venir de ce type gardent leur instantané"
  deleteAppointmentType(id: ID!, workspaceId: ID): Boolean!
  "Annulation par l'organisateur (e-mail à l'invité)"
  cancelBooking(id: ID!, workspaceId: ID, reason: String): Booking!
  "Image d'un événement (jpg, png, webp, heic ; 5 Mo max), convertie en WebP"
  uploadAppointmentEventImage(
    workspaceId: ID
    file: Upload!
    kind: EventImageKind!
  ): ImageUploadResult!
  "Annulation d'une inscription par l'organisateur (places rendues, e-mail au participant, pas de remboursement automatique)"
  cancelEventRegistration(
    id: ID!
    workspaceId: ID
    reason: String
  ): EventRegistration!
  """
  Contrôle d'un billet à l'entrée de l'événement typeId. code : URL du QR
  code, jeton seul ou numéro (« EVT-7K3M9Q », préfixe facultatif). VALID
  marque le billet présent
  """
  checkInTicket(workspaceId: ID, typeId: ID!, code: String!): TicketCheckIn!
  "Retire le marquage « présent » d'un billet"
  undoTicketCheckIn(workspaceId: ID, ticketId: ID!): EventTicket!
  "Marque (paid: true) ou démarque le reste dû sur place d'une inscription confirmée"
  markEventRegistrationPaidOnSite(
    workspaceId: ID
    id: ID!
    paid: Boolean!
  ): EventRegistration!
}
