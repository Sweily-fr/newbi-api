# Types pour le rapprochement factures/transactions bancaires

type ReconciliationSuggestion {
  transaction: ReconciliationTransaction!
  matchingInvoices: [ReconciliationInvoice!]!
  confidence: ReconciliationConfidence!
}

type ReconciliationTransaction {
  id: ID!
  amount: Float!
  description: String
  date: DateTime
  reconciliationStatus: String
  score: Int
}

type ReconciliationInvoice {
  id: ID!
  number: String
  prefix: String
  clientName: String
  totalTTC: Float
  dueDate: DateTime
  status: String
  score: Int
}

type ReconciliationSuggestionsResponse {
  success: Boolean!
  suggestions: [ReconciliationSuggestion!]!
  unmatchedCount: Int!
  pendingInvoicesCount: Int!
}

type TransactionsForInvoiceResponse {
  success: Boolean!
  transactions: [ReconciliationTransaction!]!
  invoiceAmount: Float!
}

type InvoicesForTransactionResponse {
  success: Boolean!
  invoices: [ReconciliationInvoice!]!
  transactionAmount: Float!
}

# transaction renvoie le type Transaction complet (et non ReconciliationTransaction)
# pour qu'Apollo normalise l'entité par id côté front (même __typename) et mette à
# jour la liste sans refetch réseau.
type ReconciliationLinkResponse {
  success: Boolean!
  message: String
  transaction: Transaction
  invoice: ReconciliationInvoice
}

type ReconciliationUnlinkResponse {
  success: Boolean!
  message: String
  transaction: Transaction
}

type ReconciliationIgnoreResponse {
  success: Boolean!
  message: String
}

# Factures clients importées (Qonto, OCR, Gmail) rattachables à une
# transaction. Même forme que ReconciliationInvoice (number = numéro d'origine).
type ImportedInvoicesForTransactionResponse {
  success: Boolean!
  invoices: [ReconciliationInvoice!]!
  transactionAmount: Float!
}

input ReconciliationImportedLinkInput {
  transactionId: ID!
  importedInvoiceId: ID!
}

# Enums
enum ReconciliationConfidence {
  high
  medium
  low
}

# Inputs
input ReconciliationLinkInput {
  transactionId: ID!
  invoiceId: ID!
}

input ReconciliationUnlinkInput {
  transactionId: ID
  invoiceId: ID
}

input ReconciliationIgnoreInput {
  transactionId: ID!
}

# Queries
extend type Query {
  # Suggestions de rapprochement
  reconciliationSuggestions(
    workspaceId: ID!
  ): ReconciliationSuggestionsResponse!

  # Transactions pour une facture spécifique (rattachement manuel côté facture).
  # search : filtre serveur sur description/libellé brut, ou montant si numérique.
  transactionsForInvoice(
    invoiceId: ID!
    search: String
  ): TransactionsForInvoiceResponse!

  # Factures rattachables à une transaction (rattachement manuel côté
  # transaction) : PENDING, ou COMPLETED sans transaction liée (marquée payée
  # à la main). search : numéro, nom du client, ou montant si numérique.
  invoicesForTransaction(
    transactionId: ID!
    search: String
  ): InvoicesForTransactionResponse!

  # Factures clients importées rattachables à une transaction (non rapprochées
  # d'abord, puis déjà rapprochées à une autre transaction). search : numéro
  # d'origine, client, ou montant.
  importedInvoicesForTransaction(
    transactionId: ID!
    search: String
  ): ImportedInvoicesForTransactionResponse!

  # Transactions rattachables à une facture importée (mêmes règles que
  # transactionsForInvoice).
  transactionsForImportedInvoice(
    importedInvoiceId: ID!
    search: String
  ): TransactionsForInvoiceResponse!
}

# Mutations
extend type Mutation {
  # Lier une transaction à une facture
  linkTransactionToInvoice(
    input: ReconciliationLinkInput!
  ): ReconciliationLinkResponse!

  # Délier une transaction d'une facture
  unlinkTransactionFromInvoice(
    input: ReconciliationUnlinkInput!
  ): ReconciliationUnlinkResponse!

  # Lier une transaction à une facture client importée (N↔N, additif).
  # La facture passe en COMPLETED avec la date de la transaction.
  linkTransactionToImportedInvoice(
    input: ReconciliationImportedLinkInput!
  ): ReconciliationLinkResponse!

  # Délier une transaction d'une facture importée. Plus aucune transaction
  # liée → la facture repasse VALIDATED sans date de paiement.
  unlinkTransactionFromImportedInvoice(
    input: ReconciliationImportedLinkInput!
  ): ReconciliationUnlinkResponse!

  # Ignorer une transaction (ne plus la suggérer)
  ignoreTransaction(
    input: ReconciliationIgnoreInput!
  ): ReconciliationIgnoreResponse!

  # Réintégrer au rapprochement une transaction ignorée (inverse d'ignoreTransaction)
  unignoreTransaction(
    input: ReconciliationIgnoreInput!
  ): ReconciliationIgnoreResponse!
}
