# ===== Dashboard Aggregation Types =====

type DashboardSummary {
  totalIncome: Float!
  totalExpenses: Float!
  bankBalance: Float!
  transactionCount: Int!
}

type TreasuryDataPoint {
  date: String!
  income: Float!
  expenses: Float!
  treasury: Float!
}

type TreasuryChartData {
  dataPoints: [TreasuryDataPoint!]!
  startBalance: Float!
  endBalance: Float!
  totalIncome: Float!
  totalExpenses: Float!
}

type CategoryBucket {
  name: String!
  amount: Float!
  count: Int!
  color: String!
}

type CategoryAggregation {
  categories: [CategoryBucket!]!
  total: Float!
  transactionCount: Int!
}

"""
Un côté (ventes ou achats) du cadre Facturation de l'accueil, borné au mois
calendaire courant par date d'émission. Montants TTC.
"""
type DashboardBillingMonthSide {
  """Total TTC des factures émises sur le mois"""
  total: Float!
  count: Int!
  """Non réglé (en cours / à payer), retards inclus"""
  pending: Float!
  pendingCount: Int!
  """Non réglé avec échéance dépassée (sous-ensemble de pending)"""
  overdue: Float!
  overdueCount: Int!
}

type DashboardBillingMonth {
  """Mois calendaire couvert, au format YYYY-MM (heure de Paris)"""
  month: String!
  sales: DashboardBillingMonthSide!
  purchases: DashboardBillingMonthSide!
}

input DashboardPeriodInput {
  """Preset: cumul-month, cumul-quarter, cumul-year, 30d, 90d, 365d, 730d"""
  preset: String
  """Custom start date (ISO string). Utilisé si preset est absent."""
  startDate: String
  """Custom end date (ISO string). Utilisé si preset est absent."""
  endDate: String
}

extend type Query {
  dashboardSummary(
    workspaceId: ID!
    accountId: String
    # Exclut les transactions manuelles (provider "manual") du solde et des
    # revenus/dépenses → cohérent avec le graph Bridge-only (dashboardTreasuryChart).
    excludeManual: Boolean
  ): DashboardSummary!

  dashboardTreasuryChart(
    workspaceId: ID!
    period: DashboardPeriodInput!
    accountId: String
    # Exclut les transactions manuelles (provider "manual") : la courbe reflète
    # alors uniquement le solde des comptes bancaires connectés (Bridge).
    excludeManual: Boolean
  ): TreasuryChartData!

  """
  Cadre Facturation de l'accueil : ventes et achats du mois courant.
  """
  dashboardBillingMonth(workspaceId: ID!): DashboardBillingMonth!

  dashboardCategoryAggregation(
    workspaceId: ID!
    type: String!
    period: DashboardPeriodInput!
    accountId: String
    # Exclut les transactions manuelles (provider "manual") des catégories.
    excludeManual: Boolean
  ): CategoryAggregation!
}
