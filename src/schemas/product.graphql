# Produit lié : ajouté automatiquement aux articles d'un document
# quand le produit parent est sélectionné. product est null si le
# produit cible a été supprimé.
# Arrondi appliqué à la quantité calculée d'un produit lié
enum LinkedProductRounding {
  UP
  DOWN
  NONE
}

# « quantity » produits liés pour « per » unités du produit principal
# (ex. 1 pot pour 20 m²). Quantité dans le document = principal × quantity / per,
# arrondie selon « rounding ».
type LinkedProduct {
  productId: ID!
  quantity: Float!
  per: Float!
  rounding: LinkedProductRounding!
  product: Product
}

input LinkedProductInput {
  productId: ID!
  quantity: Float!
  per: Float
  rounding: LinkedProductRounding
}

type Product {
  id: ID!
  name: String!
  description: String
  unitPrice: Float!
  vatRate: Float!
  unit: String!
  category: String
  reference: String
  customFields: [ProductCustomFieldValue]
  linkedProducts: [LinkedProduct!]!
  createdBy: User!
  createdAt: String!
  updatedAt: String!
}

type ProductPagination {
  products: [Product!]!
  totalCount: Int!
  hasNextPage: Boolean!
}

input CreateProductInput {
  workspaceId: ID!
  name: String!
  description: String
  unitPrice: Float!
  vatRate: Float!
  unit: String!
  category: String
  reference: String
  customFields: [ProductCustomFieldValueInput]
  linkedProducts: [LinkedProductInput!]
}

input UpdateProductInput {
  name: String
  description: String
  unitPrice: Float
  vatRate: Float
  unit: String
  category: String
  reference: String
  customFields: [ProductCustomFieldValueInput]
  linkedProducts: [LinkedProductInput!]
}

extend type Query {
  product(id: ID!): Product!
  products(workspaceId: ID!, search: String, category: String, page: Int, limit: Int): ProductPagination!
}

extend type Mutation {
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  deleteProduct(id: ID!): Boolean!
}
