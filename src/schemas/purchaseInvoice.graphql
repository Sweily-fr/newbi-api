# Schéma GraphQL pour les factures d'achat (fournisseurs)

enum PurchaseInvoiceStatus {
  TO_PROCESS
  TO_PAY
  PENDING
  PAID
  OVERDUE
  ARCHIVED
}

enum PurchaseInvoiceCategory {
  RENT
  SUBSCRIPTIONS
  OFFICE_SUPPLIES
  SERVICES
  TRANSPORT
  MEALS
  TELECOMMUNICATIONS
  INSURANCE
  ENERGY
  SOFTWARE
  HARDWARE
  MARKETING
  TRAINING
  MAINTENANCE
  TAXES
  UTILITIES
  OTHER
}

enum PurchaseInvoicePaymentMethod {
  BANK_TRANSFER
  CREDIT_CARD
  DIRECT_DEBIT
  CHECK
  CASH
  OTHER
}

enum PurchaseInvoiceSortField {
  issueDate
  dueDate
  amountTTC
  supplierName
  status
  createdAt
}

enum SortOrder {
  ASC
  DESC
}

# Type pour les fichiers associés
type PurchaseInvoiceFile {
  id: ID!
  filename: String!
  originalFilename: String!
  mimetype: String!
  path: String!
  size: Float!
  url: String!
  ocrProcessed: Boolean!
  ocrData: JSON
  createdAt: String!
  updatedAt: String!
}

# Métadonnées OCR spécifiques aux factures d'achat
type PurchaseInvoiceOCRMetadata {
  supplierName: String
  supplierAddress: String
  supplierVatNumber: String
  supplierSiret: String
  invoiceNumber: String
  invoiceDate: String
  dueDate: String
  amountHT: Float
  amountTVA: Float
  vatRate: Float
  amountTTC: Float
  currency: String
  iban: String
  bic: String
  confidenceScore: Float
  rawExtractedText: String
}

# Statuts e-invoicing (réception SuperPDP)
enum PurchaseInvoiceEInvoiceStatus {
  NOT_APPLICABLE
  RECEIVED
  PENDING_VALIDATION
  VALIDATED
  ACCEPTED
  PARTIALLY_ACCEPTED
  DISPUTED
  REJECTED
  PAID
  ERROR
}

# Type principal facture d'achat
type PurchaseInvoice {
  id: ID!
  supplierName: String!
  supplierId: ID
  supplier: Supplier
  invoiceNumber: String
  issueDate: String!
  dueDate: String
  amountHT: Float!
  amountTVA: Float!
  vatRate: Float!
  amountTTC: Float!
  currency: String!
  status: PurchaseInvoiceStatus!
  category: PurchaseInvoiceCategory!
  tags: [String!]
  notes: String
  internalReference: String
  files: [PurchaseInvoiceFile!]
  ocrMetadata: PurchaseInvoiceOCRMetadata
  paymentDate: String
  paymentMethod: PurchaseInvoicePaymentMethod
  linkedTransactionIds: [ID!]
  isReconciled: Boolean!
  source: String!
  # Champs e-invoicing (SuperPDP)
  superPdpInvoiceId: String
  eInvoiceStatus: PurchaseInvoiceEInvoiceStatus
  eInvoiceReceivedAt: String
  eInvoicePaymentReportStatus: String
  archivedPdfUrl: String
  createdBy: User!
  createdAt: String!
  updatedAt: String!
}

# Pagination
type PurchaseInvoicePagination {
  items: [PurchaseInvoice!]!
  totalCount: Int!
  currentPage: Int!
  totalPages: Int!
  hasNextPage: Boolean!
}

# Statistiques
type PurchaseInvoiceStats {
  totalToPay: Float!
  totalToPayCount: Int!
  # Toutes les factures non payées (TO_PROCESS, TO_PAY, PENDING, OVERDUE),
  # y compris celles reçues via SuperPDP ou saisies manuellement ; une facture
  # rapprochée bancairement passe en PAID et sort donc du total
  totalUnpaid: Float!
  totalUnpaidCount: Int!
  totalOverdue: Float!
  totalOverdueCount: Int!
  paidThisMonth: Float!
  paidThisMonthCount: Int!
  totalThisMonth: Float!
  totalThisMonthCount: Int!
}

# Résultats de suppression
type DeletePurchaseInvoiceResult {
  success: Boolean!
  message: String!
}

type BulkActionResult {
  success: Boolean!
  updatedCount: Int!
  message: String!
}

# Résultat de synchronisation SuperPDP
type SyncPurchaseInvoicesResult {
  success: Boolean!
  imported: Int!
  skipped: Int!
  errors: Int!
  message: String!
}

# Suggestion de rapprochement bancaire
type PurchaseInvoiceReconciliationMatch {
  transactionId: ID!
  amount: Float!
  date: String!
  description: String
  confidence: Float!
}

# Suggestions de rapprochement transaction (débit) -> facture d'achat.
# Réutilise ReconciliationTransaction / ReconciliationConfidence (reconciliation.graphql).
type PurchaseInvoiceReconciliationInvoice {
  id: ID!
  invoiceNumber: String
  supplierName: String
  amountTTC: Float
  issueDate: DateTime
  status: String
}

type PurchaseInvoiceReconciliationSuggestion {
  transaction: ReconciliationTransaction!
  matchingPurchaseInvoices: [PurchaseInvoiceReconciliationInvoice!]!
  confidence: ReconciliationConfidence!
}

type PurchaseInvoiceReconciliationSuggestionsResponse {
  success: Boolean!
  suggestions: [PurchaseInvoiceReconciliationSuggestion!]!
  unmatchedCount: Int!
  pendingInvoicesCount: Int!
}

# Rattachement manuel côté facture d'achat (transactions candidates).
type TransactionsForPurchaseInvoiceResponse {
  success: Boolean!
  transactions: [ReconciliationTransaction!]!
  invoiceAmount: Float!
}

# Rattachement manuel côté transaction (factures d'achat candidates).
# isReconciled : déjà liée à une autre transaction (relevé couvrant plusieurs
# prélèvements) — rattachable quand même, signalé à l'utilisateur.
type PurchaseInvoiceReconciliationCandidate {
  id: ID!
  invoiceNumber: String
  supplierName: String
  amountTTC: Float
  issueDate: DateTime
  status: String
  isReconciled: Boolean!
  score: Int
}

type PurchaseInvoicesForTransactionResponse {
  success: Boolean!
  purchaseInvoices: [PurchaseInvoiceReconciliationCandidate!]!
  transactionAmount: Float!
}

# Doublon probable (même numéro, ou même fournisseur + montant + date proche)
type PurchaseInvoiceDuplicate {
  id: ID!
  invoiceNumber: String
  supplierName: String
  amountTTC: Float
  issueDate: DateTime
  status: String
}

input PurchaseInvoiceDuplicateCheckInput {
  supplierName: String
  invoiceNumber: String
  amountTTC: Float
  issueDate: String
  excludeId: ID
}

# --- SUPPLIER ---

type Supplier {
  id: ID!
  name: String!
  email: String
  phone: String
  siret: String
  vatNumber: String
  address: Address
  iban: String
  bic: String
  defaultCategory: PurchaseInvoiceCategory
  notes: String
  invoiceCount: Int
  totalAmount: Float
  createdAt: String!
  updatedAt: String!
}

type SupplierPagination {
  items: [Supplier!]!
  totalCount: Int!
  currentPage: Int!
  totalPages: Int!
}

type DeleteSupplierResult {
  success: Boolean!
  message: String!
}

# --- INPUTS ---

input CreatePurchaseInvoiceInput {
  workspaceId: ID!
  supplierName: String!
  supplierId: ID
  invoiceNumber: String
  issueDate: String!
  dueDate: String
  amountHT: Float
  amountTVA: Float
  vatRate: Float
  amountTTC: Float!
  currency: String = "EUR"
  status: PurchaseInvoiceStatus = TO_PROCESS
  category: PurchaseInvoiceCategory = OTHER
  tags: [String!]
  notes: String
  internalReference: String
  paymentDate: String
  paymentMethod: PurchaseInvoicePaymentMethod
  source: String = "MANUAL"
}

input UpdatePurchaseInvoiceInput {
  supplierName: String
  supplierId: ID
  invoiceNumber: String
  issueDate: String
  dueDate: String
  amountHT: Float
  amountTVA: Float
  vatRate: Float
  amountTTC: Float
  currency: String
  status: PurchaseInvoiceStatus
  category: PurchaseInvoiceCategory
  tags: [String!]
  notes: String
  internalReference: String
  paymentDate: String
  paymentMethod: PurchaseInvoicePaymentMethod
}

input PurchaseInvoiceFileInput {
  file: Upload
  cloudflareUrl: String
  fileName: String
  mimeType: String
  fileSize: Float
  ocrData: JSON
  processOCR: Boolean = true
}

input CreateSupplierInput {
  workspaceId: ID!
  name: String!
  email: String
  phone: String
  siret: String
  vatNumber: String
  street: String
  city: String
  postalCode: String
  country: String
  iban: String
  bic: String
  defaultCategory: PurchaseInvoiceCategory
  notes: String
}

input UpdateSupplierInput {
  name: String
  email: String
  phone: String
  siret: String
  vatNumber: String
  street: String
  city: String
  postalCode: String
  country: String
  iban: String
  bic: String
  defaultCategory: PurchaseInvoiceCategory
  notes: String
}

# --- QUERIES ---

extend type Query {
  purchaseInvoice(id: ID!): PurchaseInvoice!

  purchaseInvoices(
    workspaceId: ID!
    page: Int
    limit: Int
    search: String
    status: PurchaseInvoiceStatus
    category: PurchaseInvoiceCategory
    supplierId: ID
    startDate: String
    endDate: String
    dueDateStart: String
    dueDateEnd: String
    minAmount: Float
    maxAmount: Float
    hasFile: Boolean
    sortField: PurchaseInvoiceSortField
    sortOrder: SortOrder
  ): PurchaseInvoicePagination!

  purchaseInvoiceStats(workspaceId: ID!): PurchaseInvoiceStats!

  purchaseInvoiceReconciliationMatches(
    purchaseInvoiceId: ID!
  ): [PurchaseInvoiceReconciliationMatch!]!

  # Suggestions globales (toast de rapprochement) : débits non rapprochés
  # rapprochés à des factures d'achat non payées.
  purchaseInvoiceReconciliationSuggestions(
    workspaceId: ID!
  ): PurchaseInvoiceReconciliationSuggestionsResponse!

  # Transactions (débits) rattachables à une facture d'achat. search : libellé,
  # référence brute, ou montant ; contourne la fenêtre de dates et inclut les
  # transactions déjà rapprochées.
  transactionsForPurchaseInvoice(
    purchaseInvoiceId: ID!
    search: String
  ): TransactionsForPurchaseInvoiceResponse!

  # Factures d'achat rattachables à une transaction. search : fournisseur,
  # numéro, ou montant.
  purchaseInvoicesForTransaction(
    transactionId: ID!
    search: String
  ): PurchaseInvoicesForTransactionResponse!

  # Factures d'achat existantes ressemblant à celle décrite (avertissement
  # avant création manuelle).
  purchaseInvoiceDuplicates(
    workspaceId: ID!
    input: PurchaseInvoiceDuplicateCheckInput!
  ): [PurchaseInvoiceDuplicate!]!

  supplier(id: ID!): Supplier!

  suppliers(
    workspaceId: ID!
    page: Int
    limit: Int
    search: String
  ): SupplierPagination!
}

# --- MUTATIONS ---

extend type Mutation {
  createPurchaseInvoice(input: CreatePurchaseInvoiceInput!): PurchaseInvoice!
  updatePurchaseInvoice(
    id: ID!
    input: UpdatePurchaseInvoiceInput!
  ): PurchaseInvoice!
  deletePurchaseInvoice(id: ID!): DeletePurchaseInvoiceResult!

  addPurchaseInvoiceFile(
    purchaseInvoiceId: ID!
    input: PurchaseInvoiceFileInput!
  ): PurchaseInvoice!
  removePurchaseInvoiceFile(
    purchaseInvoiceId: ID!
    fileId: ID!
  ): PurchaseInvoice!

  markPurchaseInvoiceAsPaid(
    id: ID!
    paymentDate: String
    paymentMethod: PurchaseInvoicePaymentMethod
  ): PurchaseInvoice!

  bulkUpdatePurchaseInvoiceStatus(
    ids: [ID!]!
    status: PurchaseInvoiceStatus!
  ): BulkActionResult!
  bulkDeletePurchaseInvoices(ids: [ID!]!): BulkActionResult!
  bulkCategorizePurchaseInvoices(
    ids: [ID!]!
    category: PurchaseInvoiceCategory!
  ): BulkActionResult!

  # Ajoute des transactions aux liens existants (N↔N, additif). Erreur si la
  # paire est déjà liée.
  reconcilePurchaseInvoice(
    purchaseInvoiceId: ID!
    transactionIds: [ID!]!
  ): PurchaseInvoice!
  # Retire UN lien (facture d'achat, transaction).
  unlinkPurchaseInvoiceFromTransaction(
    purchaseInvoiceId: ID!
    transactionId: ID!
  ): PurchaseInvoice!
  # Retire TOUS les liens de la facture d'achat.
  unreconcilePurchaseInvoice(purchaseInvoiceId: ID!): PurchaseInvoice!

  # Synchronisation e-invoicing (SuperPDP)
  syncPurchaseInvoicesFromSuperPdp(
    workspaceId: ID!
    since: String
  ): SyncPurchaseInvoicesResult!
  # Cycle de vie destinataire : approuver (fr:205) / refuser (fr:210)
  acknowledgePurchaseInvoiceEInvoice(id: ID!): PurchaseInvoice!
  refusePurchaseInvoiceEInvoice(id: ID!, reason: String): PurchaseInvoice!
  # Émission générique d'un statut de cycle de vie destinataire (fr:204..fr:212)
  # Codes supportés : fr:204 (accusé réception), fr:205 (accepté),
  # fr:206 (accepté partiellement), fr:207 (litige), fr:210 (refusé),
  # fr:211/fr:212 (paiement).
  submitPurchaseInvoiceEInvoiceEvent(
    id: ID!
    statusCode: String!
    reason: String
  ): PurchaseInvoice!

  createSupplier(input: CreateSupplierInput!): Supplier!
  updateSupplier(id: ID!, input: UpdateSupplierInput!): Supplier!
  deleteSupplier(id: ID!): DeleteSupplierResult!
  mergeSuppliers(targetId: ID!, sourceIds: [ID!]!): Supplier!
}
