# Importe les types communs
# Note: GraphQL n'a pas de directive d'importation native,
# mais la fusion des schémas gère cela pour nous

# Abonnement porté par l'utilisateur (licence, essai, client Stripe).
# Nommé « Subscription », ce type fusionnait avec le type racine des
# subscriptions GraphQL et y déclarait licence, trial et stripeCustomerId
# comme des abonnements temps réel sans resolver.
type UserSubscription {
  licence: Boolean!
  trial: Boolean!
  stripeCustomerId: String
}

type User {
  id: ID!
  email: String!
  isEmailVerified: Boolean!
  isDisabled: Boolean!
  profile: UserProfile
  company: Company
  subscription: UserSubscription
  isPartner: Boolean
  referralCode: String
  createdAt: String!
  updatedAt: String!
}

type UserProfile {
  firstName: String
  lastName: String
  phone: String
  profilePicture: String
}

input UserProfileInput {
  firstName: String
  lastName: String
  phone: String
  profilePicture: String
}

type ResetPasswordResponse {
  success: Boolean!
  message: String!
}

type UserEmailLookup {
  email: String!
  name: String
  image: String
}

extend type Query {
  me: User
  lookupUsersByEmails(emails: [String!]!): [UserEmailLookup!]!
}

# Inscription, connexion, mot de passe oublié, vérification d'adresse,
# désactivation et réactivation du compte : gérés par Better Auth et les
# routes du site. Les anciennes mutations GraphQL (register, login,
# requestPasswordReset, resetPassword, verifyEmail, resendVerificationEmail,
# disableAccount, reactivateAccount, setStripeCustomerId), sans appelant,
# ont été retirées du schéma.
extend type Mutation {
  updateProfile(input: UserProfileInput!): User!
  updateCompany(input: CompanyInput!): User!
  updateCompanyLogo(logoUrl: String, workspaceId: ID!): User!
  uploadCompanyLogo(base64Image: String!): User!
  deleteCompanyLogo: User!
  uploadProfilePicture(base64Image: String!): User!
  deleteProfilePicture: User!
  updatePassword(
    currentPassword: String!
    newPassword: String!
  ): ResetPasswordResponse!
  updatePartnerStatus(email: String!, isPartner: Boolean!): User!
}
