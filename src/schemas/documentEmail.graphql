# Schéma GraphQL pour l'envoi de documents par email

# Remise de l'e-mail au serveur du destinataire (null : envoi antérieur au suivi)
enum EmailDeliveryStatus {
  SENT
  DELIVERED
  DELAYED
  FAILED
}

type EmailTracking {
  emailSentAt: String
  emailOpenedAt: String
  emailOpenCount: Int
  emailClickedAt: String
  emailClickCount: Int
  deliveryStatus: EmailDeliveryStatus
  deliveredAt: String
  deliveryFailedAt: String
  # Raison du rejet, rédigée pour l'utilisateur
  deliveryFailureReason: String
  recipientEmail: String
}

input EmailAttachmentInput {
  filename: String!
  content: String!
  contentType: String
}

input SendDocumentEmailInput {
  documentId: ID!
  emailSubject: String!
  emailBody: String!
  recipientEmail: String!
  ccEmails: [String]
  bccEmails: [String]
  pdfBase64: String
  attachments: [EmailAttachmentInput!]
  useCustomFooter: Boolean
  customEmailFooter: String
}

type SendDocumentEmailResult {
  success: Boolean!
  messageId: String
  recipientEmail: String!
}

type DocumentEmailAttachment {
  filename: String!
  size: Int
  # PDF du document (lu depuis l'archive du document)
  isDocument: Boolean
  # Fichier consultable : PDF du document, ou fichier ajouté à la main et
  # conservé à l'envoi (/documents/email-logs/:id/attachment?index=)
  available: Boolean!
}

# Envoi d'un document par e-mail, tel que le client l'a reçu
type DocumentEmailLog {
  id: ID!
  workspaceId: ID!
  workspaceName: String
  documentType: String!
  documentId: ID!
  documentNumber: String
  originalInvoiceId: ID
  sentAt: String!
  senderEmail: String
  from: String
  replyTo: String
  to: String!
  cc: [String!]!
  bcc: [String!]!
  subject: String
  # HTML sans pixel ni liens de suivi (absent de l'historique)
  html: String
  attachments: [DocumentEmailAttachment!]!
  deliveryStatus: EmailDeliveryStatus
  deliveredAt: String
  deliveryFailedAt: String
  deliveryFailureReason: String
  openedAt: String
}

extend type Query {
  # Envoi lu dans son propre espace (lien du reçu), même si un autre est actif
  documentEmailLog(id: ID!): DocumentEmailLog
  # Envois d'un document, du plus récent au plus ancien
  documentEmailLogs(
    workspaceId: ID!
    documentType: String!
    documentId: ID!
  ): [DocumentEmailLog!]!
}

type EmailTrackingUpdate {
  documentId: ID!
  documentType: String!
  workspaceId: ID!
  emailTracking: EmailTracking!
}

extend type Mutation {
  sendInvoiceEmail(workspaceId: ID!, input: SendDocumentEmailInput!): SendDocumentEmailResult!
  sendQuoteEmail(workspaceId: ID!, input: SendDocumentEmailInput!): SendDocumentEmailResult!
  sendCreditNoteEmail(workspaceId: ID!, input: SendDocumentEmailInput!): SendDocumentEmailResult!
  sendPurchaseOrderEmail(workspaceId: ID!, input: SendDocumentEmailInput!): SendDocumentEmailResult!
  sendDeliveryNoteEmail(workspaceId: ID!, input: SendDocumentEmailInput!): SendDocumentEmailResult!
}

extend type Subscription {
  emailTrackingUpdated(workspaceId: ID!): EmailTrackingUpdate!
}
