name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Permet le déclenchement manuel

# Un seul déploiement staging à la fois. Deux pushes rapprochés sur develop
# (merges enchaînés) lançaient deux workflows en parallèle sur le MÊME dossier
# ~/staging : `npm ci` commence par supprimer node_modules, la seconde
# exécution effaçait donc ce que la première installait. Résultat le 26/09/2026
# (23:41:18 et 23:41:37) : node_modules à moitié installé, express absent, API
# staging en boucle de crash et 502 pendant 19 h, les deux runs marqués
# « success ». cancel-in-progress: false = on met en file plutôt que d'annuler,
# pour que le dernier commit déployé soit bien le dernier poussé.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 51.91.254.74 >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        run: |
          echo "🚀 Déploiement STAGING en cours..."
          SSH="ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30"

          # Même déroulé que la production (scripts/deploy/deploy-vps.sh) :
          # copie à part, démarrage d'essai, puis remplacement des instances
          # une par une. La config PM2 du staging reste celle du VPS.
          $SSH joaquim@51.91.254.74 'mkdir -p ~/staging/.deploy/next'
          rsync -az --delete --exclude='uploads' --exclude='node_modules' --exclude='.git' \
            --exclude='.env' --exclude='.env.*' \
            -e "$SSH" \
            ./* joaquim@51.91.254.74:~/staging/.deploy/next/

          $SSH joaquim@51.91.254.74 'bash ~/staging/.deploy/next/scripts/deploy/deploy-vps.sh staging'

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Déploiement STAGING réussi!"
          echo "🌐 URL: https://staging.newbi.fr (ou votre URL staging)"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Déploiement STAGING échoué!"
          echo "📋 Vérifiez les logs ci-dessus pour plus de détails"
