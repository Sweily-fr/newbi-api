name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Permet le déclenchement manuel
    inputs:
      host:
        description: "IP du serveur cible (vide = serveur habituel)"
        required: false
        default: ""

# Un seul déploiement staging à la fois. Deux pushes rapprochés sur develop
# (merges enchaînés) lançaient deux workflows en parallèle sur le MÊME dossier
# ~/staging : `npm ci` commence par supprimer node_modules, la seconde
# exécution effaçait donc ce que la première installait. Résultat le 26/09/2026
# (23:41:18 et 23:41:37) : node_modules à moitié installé, express absent, API
# staging en boucle de crash et 502 pendant 19 h, les deux runs marqués
# « success ». cancel-in-progress: false = on met en file plutôt que d'annuler,
# pour que le dernier commit déployé soit bien le dernier poussé.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    # Serveur cible : l'entrée « host » d'un lancement manuel, sinon la
    # variable de dépôt VPS_HOST_STAGING (changement de serveur), sinon le
    # serveur actuel.
    env:
      VPS_HOST: ${{ inputs.host || vars.VPS_HOST_STAGING || '51.91.254.74' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Hôte venu d'une entrée ou d'une variable : une IPv4 ou un nom,
          # rien d'autre (ni espace ni caractère interprété par le shell)
          if ! printf '%s' "$VPS_HOST" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "❌ Serveur cible invalide : $VPS_HOST"
            exit 1
          fi
          echo "🎯 Serveur cible : $VPS_HOST"
          # Une seule connexion (clé ed25519) au lieu d'une par type de clé ;
          # si le VPS la refuse, la clé est prise à la première connexion
          # (StrictHostKeyChecking=no, comme avant)
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts || true

      - name: Deploy to Staging
        run: |
          echo "🚀 Déploiement STAGING en cours..."
          # Une seule connexion SSH, partagée par toutes les commandes
          # (ControlMaster), ouverte en réessayant : le VPS refuse par
          # moments les connexions du robot (« Connection refused » dès la
          # 1re commande, 4 déploiements sur 9 le 22/11/2026, relances OK).
          SSH="ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=20m"
          for essai in $(seq 1 30); do
            if $SSH -o ConnectTimeout=15 "joaquim@$VPS_HOST" true; then break; fi
            if [ "$essai" -eq 30 ]; then
              echo "❌ VPS injoignable en SSH depuis 15 minutes"
              exit 1
            fi
            echo "Connexion SSH refusée, nouvel essai dans 30 s ($essai/30)"
            sleep 30
          done

          # Même déroulé que la production (scripts/deploy/deploy-vps.sh) :
          # copie à part, démarrage d'essai, puis remplacement des instances
          # une par une. La config PM2 du staging reste celle du VPS.
          $SSH "joaquim@$VPS_HOST" 'mkdir -p ~/staging/.deploy/next'
          rsync -az --delete --exclude='uploads' --exclude='node_modules' --exclude='.git' \
            --exclude='.env' --exclude='.env.*' \
            -e "$SSH" \
            ./* "joaquim@$VPS_HOST:~/staging/.deploy/next/"

          $SSH "joaquim@$VPS_HOST" 'bash ~/staging/.deploy/next/scripts/deploy/deploy-vps.sh staging'

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Déploiement STAGING réussi!"
          echo "🌐 URL: https://staging.newbi.fr (ou votre URL staging)"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Déploiement STAGING échoué!"
          echo "📋 Vérifiez les logs ci-dessus pour plus de détails"
