name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet le déclenchement manuel
    inputs:
      host:
        description: "IP du serveur cible (vide = serveur habituel)"
        required: false
        default: ""

# Un seul déploiement prod à la fois, même raison qu'en staging : deux runs
# simultanés partagent le dossier ~/api.newbi.fr/.deploy/next et se
# marcheraient dessus (copie, installation, démarrage d'essai, pm2 reload).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    # Serveur cible : l'entrée « host » d'un lancement manuel, sinon la
    # variable de dépôt VPS_HOST_PRODUCTION (changement de serveur), sinon le
    # serveur actuel.
    env:
      VPS_HOST: ${{ inputs.host || vars.VPS_HOST_PRODUCTION || '51.91.254.74' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Hôte venu d'une entrée ou d'une variable : une IPv4 ou un nom,
          # rien d'autre (ni espace ni caractère interprété par le shell)
          if ! printf '%s' "$VPS_HOST" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "❌ Serveur cible invalide : $VPS_HOST"
            exit 1
          fi
          echo "🎯 Serveur cible : $VPS_HOST"
          # Une seule connexion (clé ed25519) au lieu d'une par type de clé ;
          # si le VPS la refuse, la clé est prise à la première connexion
          # (StrictHostKeyChecking=no, comme avant)
          ssh-keyscan -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts || true

      - name: Deploy to Production
        run: |
          echo "🚀 Déploiement PRODUCTION en cours..."
          # Une seule connexion SSH, partagée par toutes les commandes
          # (ControlMaster), ouverte en réessayant : le VPS refuse par
          # moments les connexions du robot (« Connection refused » dès la
          # 1re commande, 4 déploiements sur 9 le 22/11/2026, relances OK).
          SSH="ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%C -o ControlPersist=20m"
          for essai in $(seq 1 30); do
            if $SSH -o ConnectTimeout=15 "joaquim@$VPS_HOST" true; then break; fi
            if [ "$essai" -eq 30 ]; then
              echo "❌ VPS injoignable en SSH depuis 15 minutes"
              exit 1
            fi
            echo "Connexion SSH refusée, nouvel essai dans 30 s ($essai/30)"
            sleep 30
          done

          # La nouvelle version arrive dans un dossier à part : la version en
          # ligne n'est modifiée qu'après un démarrage d'essai réussi, puis ses
          # instances sont remplacées une par une, sans coupure
          # (scripts/deploy/deploy-vps.sh).
          $SSH "joaquim@$VPS_HOST" 'mkdir -p ~/api.newbi.fr/.deploy/next'
          rsync -az --delete --exclude='uploads' --exclude='node_modules' --exclude='.git' \
            --exclude='.env' --exclude='.env.*' \
            -e "$SSH" \
            ./* "joaquim@$VPS_HOST:~/api.newbi.fr/.deploy/next/"

          $SSH "joaquim@$VPS_HOST" 'bash ~/api.newbi.fr/.deploy/next/scripts/deploy/deploy-vps.sh production'

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Déploiement PRODUCTION réussi!"
          echo "🌐 URL: https://www.newbi.fr"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Déploiement PRODUCTION échoué!"
          echo "📋 Vérifiez les logs ci-dessus pour plus de détails"
