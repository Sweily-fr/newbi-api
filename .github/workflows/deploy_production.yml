name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet le déclenchement manuel

# Un seul déploiement prod à la fois, même raison qu'en staging : deux runs
# simultanés partagent le dossier ~/api.newbi.fr/.deploy/next et se
# marcheraient dessus (copie, installation, démarrage d'essai, pm2 reload).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 51.91.254.74 >> ~/.ssh/known_hosts

      - name: Deploy to Production
        run: |
          echo "🚀 Déploiement PRODUCTION en cours..."
          SSH="ssh -i $HOME/.ssh/vps_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30"

          # La nouvelle version arrive dans un dossier à part : la version en
          # ligne n'est modifiée qu'après un démarrage d'essai réussi, puis ses
          # instances sont remplacées une par une, sans coupure
          # (scripts/deploy/deploy-vps.sh).
          $SSH joaquim@51.91.254.74 'mkdir -p ~/api.newbi.fr/.deploy/next'
          rsync -az --delete --exclude='uploads' --exclude='node_modules' --exclude='.git' \
            --exclude='.env' --exclude='.env.*' \
            -e "$SSH" \
            ./* joaquim@51.91.254.74:~/api.newbi.fr/.deploy/next/

          $SSH joaquim@51.91.254.74 'bash ~/api.newbi.fr/.deploy/next/scripts/deploy/deploy-vps.sh production'

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/vps_key

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Déploiement PRODUCTION réussi!"
          echo "🌐 URL: https://www.newbi.fr"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Déploiement PRODUCTION échoué!"
          echo "📋 Vérifiez les logs ci-dessus pour plus de détails"
